name: Deploy to Stage

on:
  push:
    branches:
      - develop
      - stage
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: stage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.STAGE_DATABASE_URL }}
        run: |
          cd apps/api
          npm run migrate:up

